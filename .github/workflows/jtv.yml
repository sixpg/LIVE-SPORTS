name: Generate Kodi M3U Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  generate-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Requests
        run: pip install requests

      - name: Generate M3U Playlist
        env:
          JSON_URL: ${{ secrets.JSON_URL }}
        run: |
          python << 'EOF'
          import requests
          import json
          import os

          url = os.environ["JSON_URL"]

          response = requests.get(url)
          response.raise_for_status()

          channels = response.json()

          m3u = "#EXTM3U\n\n"

          for ch in channels:
              name = ch.get("name", "Unknown")
              group = ch.get("group", "Other")
              logo = ch.get("logo", "")
              mpd = ch.get("mpd_url", "")
              license_url = ch.get("license_url", "")
              cookie = ch.get("headers", {}).get("cookie", "")
              channel_id = ch.get("id", "")

              m3u += '#KODIPROP:inputstream=inputstream.adaptive\n'
              m3u += '#KODIPROP:inputstream.adaptive.manifest_type=mpd\n'
              m3u += '#KODIPROP:inputstream.adaptive.license_type=com.widevine.alpha\n'

              if license_url:
                  m3u += f'#KODIPROP:inputstream.adaptive.license_key={license_url}\n'

              m3u += (
                  f'#EXTINF:-1 '
                  f'tvg-id="{channel_id}" '
                  f'tvg-name="{name}" '
                  f'tvg-logo="{logo}" '
                  f'group-title="{group}",{name}\n'
              )

              stream_url = mpd

              if cookie:
                  stream_url += f'|cookie={cookie}'

              m3u += f"{stream_url}\n\n"

          with open("jtv.m3u", "w", encoding="utf-8") as f:
              f.write(m3u)

          print("jtv.m3u generated successfully")
          EOF

      - name: Commit Playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add jtv.m3u

          git commit -m "Updated JTV Playlist" || echo "No changes"

          git push

name: Auto Update M3U

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Requests
        run: pip install requests

      - name: Generate Playlist
        env:
          CHANNEL_FETCHER: ${{ secrets.CHANNEL_FETCHER }}
          COOKIE_FETCHER: ${{ secrets.COOKIE_FETCHER }}
          PLLIVE_COOKIE_FETCHER: ${{ secrets.PLLIVE_COOKIE_FETCHER }}

        run: |
          python <<EOF

          import os
          import requests
          from urllib.parse import urlparse, parse_qs

          # =====================================================
          # SAFE JSON FETCHER
          # =====================================================

          def safe_json(url):

              try:

                  headers = {
                      "User-Agent": "Mozilla/5.0"
                  }

                  r = requests.get(
                      url,
                      headers=headers,
                      timeout=60
                  )

                  print(f"{url} -> {r.status_code}")

                  if r.status_code != 200:
                      return None

                  return r.json()

              except Exception as e:

                  print(f"ERROR FETCHING {url}: {e}")

                  return None

          # =====================================================
          # LOAD SECRETS
          # =====================================================

          CHANNEL_FETCHER = os.environ["CHANNEL_FETCHER"]
          COOKIE_FETCHER = os.environ["COOKIE_FETCHER"]
          PLLIVE_COOKIE_FETCHER = os.environ["PLLIVE_COOKIE_FETCHER"]

          # =====================================================
          # FETCH DATA
          # =====================================================

          channels = safe_json(CHANNEL_FETCHER) or []

          print(f"Total channels fetched: {len(channels)}")

          cookie_data = safe_json(COOKIE_FETCHER) or []

          pllive_cookie_data = safe_json(PLLIVE_COOKIE_FETCHER) or {}

          # =====================================================
          # EXTRACT NORMAL COOKIE
          # =====================================================

          normal_cookie = ""

          if isinstance(cookie_data, list):

              for item in cookie_data:

                  if isinstance(item, dict) and "cookie" in item:

                      normal_cookie = item["cookie"]

                      break

          print(f"Normal cookie loaded: {bool(normal_cookie)}")

          # =====================================================
          # BUILD PLLIVE COOKIE MAP
          # =====================================================

          pllive_cookie_map = {}

          if isinstance(pllive_cookie_data, dict):

              results = (
                  pllive_cookie_data.get("successful_results", [])
                  + pllive_cookie_data.get("failed_results", [])
              )

              for item in results:

                  cid = str(item.get("channel_id", "")).strip()

                  final_url = (
                      item.get("error_details", {}).get("final_url", "")
                  )

                  if not cid or not final_url:
                      continue

                  try:

                      parsed = urlparse(final_url)

                      qs = parse_qs(parsed.query)

                      hdnea = qs.get("__hdnea__", [""])[0]

                      if hdnea:

                          pllive_cookie_map[cid] = (
                              f"__hdnea__={hdnea}"
                          )

                  except:
                      pass

          print(f"PLLIVE cookies loaded: {len(pllive_cookie_map)}")

          # =====================================================
          # PLAYLIST GENERATION
          # =====================================================

          lines = ['#EXTM3U']

          used = set()

          def add_channel(ch):

              name = ch.get("name", "Unknown")
              cid = str(ch.get("id", "")).strip()
              category = ch.get("category", "Live TV")
              logo = ch.get("logo", "")
              url = ch.get("url", "")
              kid = ch.get("keyId", "")
              key = ch.get("key", "")

              if not url:
                  return

              if url in used:
                  return

              used.add(url)

              lines.append(
                  f'#EXTINF:-1 tvg-id="{cid}" tvg-logo="{logo}" group-title="{category}",{name}'
              )

              # =============================================
              # DRM
              # =============================================

              if (
                  kid not in ["", "null", None]
                  and key not in ["", "null", None]
              ):

                  lines.append(
                      "#KODIPROP:inputstream.adaptive.license_type=clearkey"
                  )

                  lines.append(
                      f"#KODIPROP:inputstream.adaptive.license_key={kid}:{key}"
                  )

              final_url = url

              # =============================================
              # jiotvpllive COOKIE
              # =============================================

              if "https://jiotvpllive.cdn.jio.com" in url:

                  cookie = pllive_cookie_map.get(cid, "")

                  if cookie:

                      final_url = (
                          f"{url}|Cookie={cookie}"
                      )

              # =============================================
              # jiotvmblive COOKIE
              # =============================================

              elif "https://jiotvmblive.cdn.jio.com" in url:

                  if normal_cookie:

                      final_url = (
                          f"{url}|Cookie={normal_cookie}"
                      )

              lines.append(final_url)

              lines.append("")

          # =====================================================
          # PROCESS CHANNELS
          # =====================================================

          for ch in channels:

              add_channel(ch)

          # =====================================================
          # SAVE FILE
          # =====================================================

          with open("jtv.m3u", "w", encoding="utf-8") as f:

              f.write("\n".join(lines))

          print(f"Generated {len(used)} channels successfully")

          EOF

      - name: Commit Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add jtv.m3u

          git commit -m "Auto update playlist" || echo "No changes"

          git push

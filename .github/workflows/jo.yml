name: Auto Update M3U

on:
workflow_dispatch:
schedule:
- cron: "*/30 * * * *"

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout Repo
    uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - name: Install Requests
    run: pip install requests

  - name: Generate M3U
    env:
      API_URL: ${{ secrets.API_URL }}
      COOKIE_URL: ${{ secrets.COOKIE_URL }}
    run: |
      python <<EOF
      import os
      import requests

      url = os.environ["API_URL"]
      cookie_url = os.environ["COOKIE_URL"]

      r = requests.get(url, timeout=60)
      data = r.json()

      channel_cookies = {}

      try:
          cookie_data = requests.get(cookie_url, timeout=30).json()

          for item in cookie_data.get("failed_results", []):
              channel_id = str(item.get("channel_id", ""))

              final_url = item.get(
                  "error_details", {}
              ).get("final_url", "")

              if "?" in final_url:
                  _, cookie = final_url.split("?", 1)
                  channel_cookies[channel_id] = cookie

      except Exception:
          channel_cookies = {}

      lines = ["#EXTM3U"]

      for ch in data:
          name = ch.get("channel_name", "Unknown")
          logo = ch.get("channel_logo", "")
          gid = str(ch.get("channel_id", ""))
          group = ch.get("channel_genre", "Live TV")

          stream = (
              ch.get("mpd_url")
              or ch.get("channel_url")
              or ""
          ).strip()

          kid = (
              ch.get("kid")
              or ch.get("keyId")
              or ""
          )

          key = (
              ch.get("key")
              or ""
          )

          if not stream:
              continue

          if "?" in stream:
              base, query = stream.split("?", 1)
              stream = (
                  f"{base}|User-Agent=@Droovy&Cookie={query}"
              )

          elif gid in channel_cookies:
              stream = (
                  f"{stream}|User-Agent=@Droovy&Cookie="
                  f"{channel_cookies[gid]}"
              )

          else:
              stream = f"{stream}|User-Agent=@Droovy"

          lines.append(
              f'#EXTINF:-1 '
              f'tvg-id="{gid}" '
              f'tvg-name="{name}" '
              f'tvg-logo="{logo}" '
              f'group-title="{group}",{name}'
          )

          if ".mpd" in stream.lower():
              lines.append(
                  "#KODIPROP:inputstream.adaptive.manifest_type=mpd"
              )

          if (
              kid not in ["", "null", None]
              and
              key not in ["", "null", None]
          ):
              lines.append(
                  "#KODIPROP:inputstream.adaptive.license_type=clearkey"
              )
              lines.append(
                  f"#KODIPROP:inputstream.adaptive.license_key={kid}:{key}"
              )

          lines.append(stream)
          lines.append("")

      with open(
          "jtv.m3u",
          "w",
          encoding="utf-8"
      ) as f:
          f.write("\n".join(lines))

      print(
          f"Generated {len(data)} channels."
      )
      EOF

  - name: Commit Files
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add jtv.m3u
      git commit -m "Auto update playlist" || echo "No changes"
      git push

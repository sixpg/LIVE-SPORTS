
name: FanCode Master Playlist Auto Update

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: fancode-master-update
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate FanCode JSON
        env:
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import shutil
          from pathlib import Path

          SOURCE = (
              "https://raw.githubusercontent.com/"
              "sportlive18/Fancode-New-Auto-Update/"
              "refs/heads/main/fancode3.json"
          )

          BASE = os.environ.get(
              "SITE_BASE_URL", ""
          ).strip().rstrip("/")

          if not BASE.startswith("https://"):
              raise ValueError("Invalid SITE_BASE_URL secret.")

          QUALITY_ORDER = [
              "1080p", "720p", "540p",
              "480p", "360p", "240p"
          ]

          print("Fetching FanCode source JSON...")

          request = urllib.request.Request(
              SOURCE,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(
              request, timeout=45
          ) as response:
              data = json.loads(
                  response.read().decode("utf-8")
              )

          if not isinstance(data, dict):
              raise ValueError("Invalid JSON root.")

          matches = data.get("matches")

          if not isinstance(matches, list):
              raise ValueError("Missing matches array.")

          updated = 0
          skipped = 0

          for match in matches:

              if not isinstance(match, dict):
                  continue

              match_id = str(match.get("match_id", ""))

              auto = match.get("auto_streams", {})

              if not isinstance(auto, dict):
                  auto = {}

              preferred = str(
                  match.get("language", "")
              ).upper()

              languages = sorted(
                  auto.items(),
                  key=lambda item: (
                      str(item[0]).upper() != preferred
                  )
              )

              selected_language = None

              for language, info in languages:

                  if not isinstance(info, dict):
                      continue

                  qualities = info.get("streams", {})

                  if not isinstance(qualities, dict):
                      continue

                  valid = any(
                      isinstance(qualities.get(q), str)
                      and qualities[q].startswith(
                          ("https://", "http://")
                      )
                      for q in QUALITY_ORDER
                  )

                  if valid:
                      selected_language = str(language).lower()
                      break

              # Remove temporary source fields
              match.pop("auto_streams", None)
              match.pop("master_m3u8", None)

              if selected_language and match_id:

                  master_url = (
                      f"{BASE}/{match_id}_"
                      f"{selected_language}/index.m3u8"
                  )

                  match["streams"] = {
                      "primary": master_url,
                      "fancode_cdn": master_url
                  }

                  updated += 1

                  print(
                      f"UPDATED: {match_id} "
                      f"({selected_language})"
                  )

              else:
                  match.pop("streams", None)
                  skipped += 1

                  print(
                      f"SKIPPED: {match_id} "
                      "- No valid quality streams"
                  )

          print("--------------------------------")
          print("TOTAL MATCHES:", len(matches))
          print("UPDATED:", updated)
          print("SKIPPED:", skipped)
          print("--------------------------------")

          if updated == 0:
              print(
                  "No usable streams. "
                  "Keeping previous JSON."
              )
              raise SystemExit(0)

          # Remove old playlist storage folders
          old_public = Path("public")

          if old_public.exists():
              shutil.rmtree(old_public)

          for playlist in Path(".").rglob("index.m3u8"):
              if ".git" in playlist.parts:
                  continue

              folder = playlist.parent

              if folder.exists():
                  shutil.rmtree(folder)
                  print("Removed old folder:", folder)

          # Save JSON directly in repository root
          output = Path("fancode.json")

          output.write_text(
              json.dumps(
                  data,
                  indent=2,
                  ensure_ascii=False
              ) + "\n",
              encoding="utf-8"
          )

          print("Generated:", output)
          print("FanCode master JSON completed!")
          PY

      - name: Commit Updated Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Update FanCode master JSON"
            git push origin main
            echo "Changes successfully committed."
          else
            echo "No changes detected."
          fi

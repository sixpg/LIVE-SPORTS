
name: FanCode Master Playlist Auto Update

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: fancode-master-update
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate FanCode Master JSON
        env:
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
        run: |
          python - <<'PY'
          import os
          import re
          import json
          import urllib.request
          import shutil
          from pathlib import Path
          from urllib.parse import urlparse

          SOURCE = (
              "https://raw.githubusercontent.com/"
              "sportlive18/Fancode-New-Auto-Update/"
              "refs/heads/main/fancode3.json"
          )

          BASE = os.environ.get(
              "SITE_BASE_URL", ""
          ).strip().rstrip("/")

          if not BASE.startswith("https://"):
              raise ValueError(
                  "Invalid SITE_BASE_URL secret."
              )

          QUALITY_ORDER = [
              "1080p",
              "720p",
              "540p",
              "480p",
              "360p",
              "240p"
          ]

          print("Fetching FanCode source JSON...")

          request = urllib.request.Request(
              SOURCE,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          with urllib.request.urlopen(
              request,
              timeout=45
          ) as response:
              data = json.loads(
                  response.read().decode("utf-8")
              )

          if not isinstance(data, dict):
              raise ValueError("Invalid JSON root.")

          matches = data.get("matches")

          if not isinstance(matches, list):
              raise ValueError("Missing matches array.")

          print("Total matches:", len(matches))

          def get_language_streams(match):

              auto = match.get("auto_streams", {})

              if not isinstance(auto, dict):
                  return None

              preferred = str(
                  match.get("language", "")
              ).upper()

              languages = sorted(
                  auto.items(),
                  key=lambda item: (
                      str(item[0]).upper() != preferred
                  )
              )

              for language, info in languages:

                  if not isinstance(info, dict):
                      continue

                  qualities = info.get("streams", {})

                  if not isinstance(qualities, dict):
                      continue

                  valid_urls = {}

                  for quality in QUALITY_ORDER:

                      stream_url = qualities.get(quality)

                      if (
                          isinstance(stream_url, str)
                          and stream_url.startswith(
                              ("https://", "http://")
                          )
                      ):
                          valid_urls[quality] = stream_url

                  if not valid_urls:
                      continue

                  # Extract original FanCode CDN folder
                  first_url = next(
                      iter(valid_urls.values())
                  )

                  parsed = urlparse(first_url)

                  folder = Path(
                      parsed.path
                  ).parent.name

                  # Validate original folder format
                  if not re.fullmatch(
                      r"\d+_[a-zA-Z]+_hls_[a-zA-Z0-9_-]+",
                      folder
                  ):
                      print(
                          "INVALID CDN FOLDER:",
                          folder
                      )
                      continue

                  return (
                      str(language).lower(),
                      folder
                  )

              return None

          updated = 0
          skipped = 0

          for match in matches:

              if not isinstance(match, dict):
                  continue

              match_id = str(
                  match.get("match_id", "unknown")
              )

              result = get_language_streams(match)

              # Remove temporary source fields
              match.pop("auto_streams", None)
              match.pop("master_m3u8", None)

              if result:

                  language, folder = result

                  master_url = (
                      f"{BASE}/{folder}/index.m3u8"
                  )

                  # Keep ONLY these two stream fields
                  match["streams"] = {
                      "primary": master_url,
                      "fancode_cdn": master_url
                  }

                  updated += 1

                  print(
                      f"UPDATED: {match_id}"
                  )

                  print(
                      f"LANGUAGE: {language}"
                  )

                  print(
                      f"CDN FOLDER: {folder}"
                  )

                  print(
                      f"MASTER URL: {master_url}"
                  )

              else:

                  match.pop("streams", None)

                  skipped += 1

                  print(
                      f"SKIPPED: {match_id} "
                      "- No valid CDN folder or streams"
                  )

          print("--------------------------------")
          print("FANCODE MASTER JSON REPORT")
          print("--------------------------------")
          print("Total matches:", len(matches))
          print("Updated matches:", updated)
          print("Skipped matches:", skipped)
          print("--------------------------------")

          # Preserve previous JSON if no streams exist
          if updated == 0:
              print(
                  "No valid streams found. "
                  "Keeping previous JSON."
              )
              raise SystemExit(0)

          # Remove old public folder
          old_public = Path("public")

          if old_public.exists():
              shutil.rmtree(old_public)
              print("Removed old public folder.")

          # Remove previously generated root playlist folders
          for item in Path(".").iterdir():

              if not item.is_dir() or item.name == ".git":
                  continue

              if re.fullmatch(
                  r"\d+_[a-zA-Z]+_hls_[a-zA-Z0-9_-]+",
                  item.name
              ):
                  shutil.rmtree(item)
                  print("Removed old playlist folder:", item)

          # Generate JSON in repository root
          output = Path("fancode.json")

          output.write_text(
              json.dumps(
                  data,
                  indent=2,
                  ensure_ascii=False
              ) + "\n",
              encoding="utf-8"
          )

          print("--------------------------------")
          print("Generated:", output)
          print("No M3U8 files or folders generated.")
          print("FanCode master JSON completed!")
          PY

      - name: Commit Updated Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Update FanCode master JSON"
            git push origin main
            echo "Changes successfully committed."
          else
            echo "No changes detected."
          fi

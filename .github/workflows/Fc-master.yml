
name: FanCode Master M3U8 Auto Update

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: fancode-master-update
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate Master Playlists
        env:
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
        run: |
          python - <<'PY'
          import os
          import re
          import json
          import urllib.request
          from pathlib import Path
          from urllib.parse import urlparse

          SOURCE = (
              "https://raw.githubusercontent.com/"
              "sportlive18/Fancode-New-Auto-Update/"
              "refs/heads/main/fancode3.json"
          )

          BASE = os.environ.get(
              "SITE_BASE_URL", ""
          ).strip().rstrip("/")

          if not BASE.startswith("https://"):
              raise ValueError(
                  "Invalid SITE_BASE_URL secret."
              )

          # Quality configuration
          BANDWIDTHS = {
              "240p": 350000,
              "360p": 650000,
              "480p": 1000000,
              "540p": 1500000,
              "720p": 2500000,
              "1080p": 4500000
          }

          RESOLUTIONS = {
              "240p": "426x240",
              "360p": "640x360",
              "480p": "854x480",
              "540p": "960x540",
              "720p": "1280x720",
              "1080p": "1920x1080"
          }

          print("Fetching FanCode source JSON...")

          request = urllib.request.Request(
              SOURCE,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          with urllib.request.urlopen(
              request, timeout=45
          ) as response:
              data = json.loads(
                  response.read().decode("utf-8")
              )

          if not isinstance(data, dict):
              raise ValueError("Invalid JSON root.")

          matches = data.get("matches")

          if not isinstance(matches, list):
              raise ValueError("Missing matches array.")

          print("Total matches:", len(matches))

          PUBLIC = Path("public")
          PUBLIC.mkdir(exist_ok=True)

          generated = 0
          updated = 0
          skipped = 0

          for match in matches:

              if not isinstance(match, dict):
                  continue

              match_id = str(
                  match.get("match_id", "unknown")
              )

              auto = match.get("auto_streams", {})

              if not isinstance(auto, dict) or not auto:
                  skipped += 1
                  print(
                      f"SKIPPED {match_id}: "
                      "auto_streams empty"
                  )
                  continue

              language_masters = {}

              for language, info in auto.items():

                  if not isinstance(info, dict):
                      continue

                  qualities = info.get("streams", {})

                  if not isinstance(qualities, dict):
                      continue

                  # Accept only valid HTTP quality URLs
                  variants = []

                  for quality, bandwidth in BANDWIDTHS.items():

                      url = qualities.get(quality)

                      if (
                          isinstance(url, str)
                          and url.startswith(("https://", "http://"))
                      ):
                          variants.append(
                              (quality, url, bandwidth)
                          )

                  if not variants:
                      continue

                  # Identify original stream folder
                  first_url = variants[0][1]
                  parsed = urlparse(first_url)

                  folder = Path(
                      parsed.path
                  ).parent.name

                  if not folder:
                      folder = f"{match_id}_{language.lower()}"

                  # Prevent unsafe folder names
                  folder = re.sub(
                      r"[^a-zA-Z0-9_.-]",
                      "_",
                      folder
                  )

                  if folder in ("", ".", ".."):
                      print(
                          f"INVALID FOLDER: {match_id}"
                      )
                      continue

                  playlist_dir = PUBLIC / folder
                  playlist_dir.mkdir(
                      parents=True,
                      exist_ok=True
                  )

                  master_path = (
                      playlist_dir / "index.m3u8"
                  )

                  # Create master M3U8
                  lines = [
                      "#EXTM3U",
                      "#EXT-X-VERSION:3"
                  ]

                  for quality, url, bandwidth in variants:

                      lines.append("")
                      lines.append(
                          "#EXT-X-STREAM-INF:"
                          f"BANDWIDTH={bandwidth},"
                          f"RESOLUTION={RESOLUTIONS[quality]}"
                      )
                      lines.append(url)

                  master_path.write_text(
                      "\n".join(lines) + "\n",
                      encoding="utf-8"
                  )

                  master_url = (
                      f"{BASE}/{folder}/index.m3u8"
                  )

                  language_masters[
                      language.upper()
                  ] = master_url

                  generated += 1

                  print(
                      f"GENERATED: {match_id} "
                      f"{language} "
                      f"({len(variants)} qualities)"
                  )

              # Skip matches without a generated master
              if not language_masters:
                  skipped += 1
                  continue

              # Select matching language
              language = str(
                  match.get("language", "")
              ).upper()

              master_url = language_masters.get(
                  language,
                  next(iter(language_masters.values()))
              )

              # Update only the requested stream fields
              streams = match.get("streams")

              if not isinstance(streams, dict):
                  streams = {}
                  match["streams"] = streams

              streams["primary"] = master_url
              streams["fancode_cdn"] = master_url

              updated += 1

              print(
                  f"UPDATED: {match_id} -> {master_url}"
              )

          print("--------------------------------")
          print("FANCODE MASTER GENERATION REPORT")
          print("--------------------------------")
          print("Generated playlists:", generated)
          print("Updated matches:", updated)
          print("Skipped matches:", skipped)
          print("--------------------------------")

          # Do not replace the last published JSON
          # when the source has no usable quality URLs.
          if generated == 0:
              print(
                  "WARNING: No quality URLs available."
              )
              print(
                  "Keeping previously published JSON "
                  "and playlists unchanged."
              )
              raise SystemExit(0)

          # Remove auto_streams from published matches
          for match in matches:
              if isinstance(match, dict):
                  match.pop("auto_streams", None)

          # Save original JSON structure
          output_json = (
              PUBLIC / "fancode-master.json"
          )

          output_json.write_text(
              json.dumps(
                  data,
                  indent=2,
                  ensure_ascii=False
              ) + "\n",
              encoding="utf-8"
          )

          print("JSON generated:", output_json)
          print("Master generation completed!")

          PY

      - name: Commit Updated Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/

          if ! git diff --cached --quiet; then
            git commit -m "Update FanCode master playlists"
            git push origin main
            echo "Changes successfully committed."
          else
            echo "No changes detected."
          fi

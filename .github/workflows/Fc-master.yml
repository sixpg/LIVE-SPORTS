
name: FanCode JSON Auto Update

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: fancode-json-update
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Fetch and generate JSON
      - name: Generate FanCode JSON
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import shutil
          from pathlib import Path

          SOURCE = (
              "https://raw.githubusercontent.com/"
              "sportlive18/Fancode-New-Auto-Update/"
              "refs/heads/main/fancode3.json"
          )

          QUALITY_ORDER = [
              "1080p",
              "720p",
              "540p",
              "480p",
              "360p",
              "240p"
          ]

          print("Fetching FanCode source JSON...")

          request = urllib.request.Request(
              SOURCE,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          with urllib.request.urlopen(
              request,
              timeout=45
          ) as response:
              data = json.loads(
                  response.read().decode("utf-8")
              )

          if not isinstance(data, dict):
              raise ValueError("Invalid JSON root.")

          matches = data.get("matches")

          if not isinstance(matches, list):
              raise ValueError("Missing matches array.")

          print("Total matches:", len(matches))

          def get_best_stream(match):

              auto = match.get("auto_streams", {})

              if not isinstance(auto, dict):
                  return None

              preferred = str(
                  match.get("language", "")
              ).upper()

              languages = sorted(
                  auto.items(),
                  key=lambda item: (
                      str(item[0]).upper() != preferred
                  )
              )

              for language, info in languages:

                  if not isinstance(info, dict):
                      continue

                  qualities = info.get("streams", {})

                  if not isinstance(qualities, dict):
                      continue

                  for quality in QUALITY_ORDER:

                      stream_url = qualities.get(quality)

                      if (
                          isinstance(stream_url, str)
                          and stream_url.startswith(
                              ("https://", "http://")
                          )
                      ):
                          return stream_url

              return None

          updated = 0
          skipped = 0

          for match in matches:

              if not isinstance(match, dict):
                  continue

              match_id = str(
                  match.get("match_id", "unknown")
              )

              stream_url = get_best_stream(match)

              # Remove temporary source fields
              match.pop("auto_streams", None)
              match.pop("master_m3u8", None)

              if stream_url:

                  # Keep ONLY primary and fancode_cdn
                  match["streams"] = {
                      "primary": stream_url,
                      "fancode_cdn": stream_url
                  }

                  updated += 1

                  print(
                      f"UPDATED: {match_id}"
                  )

              else:

                  # No valid stream available
                  match.pop("streams", None)

                  skipped += 1

                  print(
                      f"SKIPPED: {match_id} "
                      "- No usable stream URL"
                  )

          print("--------------------------------")
          print("FANCODE JSON REPORT")
          print("--------------------------------")
          print("Total matches:", len(matches))
          print("Updated matches:", updated)
          print("Skipped matches:", skipped)
          print("--------------------------------")

          # Preserve existing JSON if source has no streams
          if updated == 0:
              print(
                  "No usable streams found. "
                  "Keeping previous JSON."
              )
              raise SystemExit(0)

          # Remove old public folder and its contents
          old_public = Path("public")

          if old_public.exists():
              shutil.rmtree(old_public)
              print("Removed old public folder.")

          # Remove old generated playlist folders
          # identified by containing index.m3u8
          for playlist in Path(".").rglob("index.m3u8"):

              if ".git" in playlist.parts:
                  continue

              folder = playlist.parent

              if folder.exists():
                  shutil.rmtree(folder)
                  print("Removed:", folder)

          # Generate JSON in repository root
          output = Path("fancode.json")

          output.write_text(
              json.dumps(
                  data,
                  indent=2,
                  ensure_ascii=False
              ) + "\n",
              encoding="utf-8"
          )

          print("--------------------------------")
          print("Generated:", output)
          print("FanCode JSON update completed!")
          PY

      # Commit JSON and delete old generated files
      - name: Commit Updated Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Update FanCode JSON"
            git push origin main
            echo "Changes successfully committed."
          else
            echo "No changes detected."
          fi

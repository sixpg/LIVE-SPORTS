<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DASH DRM Player</title>

  <!-- DASH.JS -->
  <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>

  <!-- DASH UI -->
  <link rel="stylesheet" href="https://cdn.dashjs.org/latest/modern/controls.css">
  <script src="https://cdn.dashjs.org/latest/modern/controls.js"></script>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#000;
      overflow:hidden;
      font-family:Arial,sans-serif;
    }

    #player-container{
      width:100%;
      height:100vh;
      position:relative;
      background:#000;
    }

    video{
      width:100%;
      height:100%;
      background:#000;
    }

    #loading{
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%);
      color:#fff;
      font-size:20px;
      z-index:9999;
    }

    #error{
      position:absolute;
      bottom:20px;
      left:20px;
      color:red;
      font-size:16px;
      z-index:9999;
      max-width:90%;
      word-wrap:break-word;
    }

  </style>
</head>

<body>

<div id="player-container">

  <div id="loading">Loading Stream...</div>

  <div id="error"></div>

  <video
    id="videoPlayer"
    class="dashjs-player"
    controls
    autoplay
    playsinline
  ></video>

</div>

<script>

(async () => {

  // =====================================
  // GET STREAM ID
  // Example:
  // player.html?id=3122
  // =====================================

  const params = new URLSearchParams(window.location.search);

  const streamId = params.get("id");

  if (!streamId) {
    showError("No stream ID provided");
    return;
  }

  // =====================================
  // API URL
  // =====================================

  const apiUrl =
    `https://footsters.playsportsapi.workers.dev/?id=${streamId}`;

  try {

    // =====================================
    // FETCH JSON
    // =====================================

    const response = await fetch(apiUrl);

    if (!response.ok) {
      throw new Error("Failed to fetch API");
    }

    const data = await response.json();

    console.log("FULL JSON:", data);

    // =====================================
    // ACCESS STREAM
    // JSON FORMAT:
    // {
    //   "3122": {
    //      url: ...
    //   }
    // }
    // =====================================

    const stream = data[streamId];

    if (!stream) {
      throw new Error("Stream not found");
    }

    // =====================================
    // VALIDATION
    // =====================================

    if (!stream.url) {
      throw new Error("MPD URL missing");
    }

    if (!stream.keys) {
      throw new Error("DRM keys missing");
    }

    // =====================================
    // VIDEO ELEMENT
    // =====================================

    const video =
      document.getElementById("videoPlayer");

    // Poster
    if (stream.poster && stream.poster !== "") {
      video.poster = stream.poster;
    }

    // =====================================
    // DASH PLAYER
    // =====================================

    const player =
      dashjs.MediaPlayer().create();

    // DRM CLEARKEY
    player.setProtectionData({
      "org.w3.clearkey": {
        clearkeys: stream.keys
      }
    });

    // PLAYER SETTINGS
    player.updateSettings({
      streaming: {
        lowLatencyEnabled: true,
        fastSwitchEnabled: true
      }
    });

    // INIT PLAYER
    player.initialize(
      video,
      stream.url,
      true
    );

    // =====================================
    // DASH UI CONTROLS
    // =====================================

    const ui =
      new ControlBar(player);

    ui.initialize();

    // =====================================
    // EVENTS
    // =====================================

    player.on(
      dashjs.MediaPlayer.events.STREAM_INITIALIZED,
      () => {

        console.log("Stream Started");

        document.getElementById("loading")
          .style.display = "none";
      }
    );

    player.on(
      dashjs.MediaPlayer.events.ERROR,
      (e) => {

        console.error("DASH ERROR:", e);

        showError("Playback Error");

        document.getElementById("loading")
          .style.display = "none";
      }
    );

  } catch (err) {

    console.error(err);

    showError(err.message);

    document.getElementById("loading")
      .style.display = "none";
  }

  // =====================================
  // ERROR FUNCTION
  // =====================================

  function showError(msg) {

    document.getElementById("error")
      .innerText = msg;
  }

})();

</script>

</body>
</html>

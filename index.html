<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shaka Player</title>

  <!-- Shaka UI CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.4/dist/controls.min.css"
  >

  <!-- Shaka Player + UI -->
  <script
    src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.4/dist/shaka-player.ui.min.js">
  </script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }

    #video-container {
      width: 100%;
      height: 100vh;
      background: #000;
      position: relative;
    }

    video {
      width: 100%;
      height: 100%;
      background: #000;
      display: block;
    }

    #status {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 10;
      padding: 7px 12px;
      background: rgba(0,0,0,.75);
      color: #fff;
      border-radius: 5px;
      font: 13px Arial,sans-serif;
      pointer-events: none;
    }
  </style>
</head>

<body>

<div id="video-container">

  <video
    id="video"
    autoplay
    playsinline>
  </video>

  <div id="status">Loading...</div>

</div>

<script>
(async () => {

  const MPD_URL =
    "https://la.drmlive.net/tp/sling-2406.mpd";

  const KEY_URL =
    "https://la.drmlive.net/tp/sling_ck?id=2406";

  const video =
    document.getElementById("video");

  const container =
    document.getElementById("video-container");

  const status =
    document.getElementById("status");

  function setStatus(message) {
    status.textContent = message;
  }

  /* Check browser support */
  if (!shaka.Player.isBrowserSupported()) {
    setStatus("Shaka Player is not supported in this browser.");
    return;
  }

  /* Create Shaka Player */
  const player =
    new shaka.Player(video);

  /* Create Shaka UI */
  const ui =
    new shaka.ui.Overlay(
      player,
      container,
      video
    );

  /*
   * Shaka UI configuration
   */
  ui.configure({

    controlPanelElements: [
      "play_pause",
      "time_and_duration",
      "spacer",
      "mute",
      "volume",
      "overflow_menu",
      "fullscreen"
    ],

    overflowMenuButtons: [
      "quality",
      "language",
      "captions",
      "playback_rate"
    ]

  });

  /* Shaka error handler */
  player.addEventListener("error", event => {

    console.error(
      "Shaka Error:",
      event.detail
    );

    setStatus(
      "Playback error: " +
      (event.detail?.code || "Unknown")
    );

  });

  /* Player events */
  player.addEventListener("buffering", event => {

    if (event.buffering) {
      setStatus("Buffering...");
    } else {
      setStatus("Playing");
    }

  });

  /*
   * Request the supplied key endpoint.
   *
   * This expects a standard ClearKey response:
   *
   * {
   *   "keys": [
   *     {
   *       "kty": "oct",
   *       "kid": "...",
   *       "k": "..."
   *     }
   *   ],
   *   "type": "temporary"
   * }
   */
  async function loadKeys() {

    try {

      const response =
        await fetch(KEY_URL, {
          method: "GET",
          credentials: "include",
          cache: "no-store"
        });

      if (!response.ok) {
        throw new Error(
          "Key endpoint HTTP " +
          response.status
        );
      }

      const data =
        await response.json();

      console.log(
        "Key response:",
        data
      );

      if (
        !data ||
        !Array.isArray(data.keys)
      ) {
        console.log(
          "Response is not standard ClearKey JSON."
        );
        return;
      }

      const clearKeys = {};

      for (const item of data.keys) {

        if (!item.kid || !item.k)
          continue;

        const kid =
          item.kid
            .replace(/-/g, "")
            .toLowerCase();

        const key =
          item.k
            .replace(/-/g, "")
            .toLowerCase();

        clearKeys[kid] = key;
      }

      if (
        Object.keys(clearKeys).length
      ) {

        player.configure({
          drm: {
            clearKeys: clearKeys
          }
        });

        console.log(
          "ClearKey configured."
        );
      }

    } catch (error) {

      console.warn(
        "Could not load ClearKey:",
        error
      );

    }
  }

  /*
   * Load keys first.
   */
  await loadKeys();

  /*
   * Load MPD.
   */
  try {

    setStatus("Loading MPD...");

    await player.load(MPD_URL);

    setStatus("Playing");

    console.log(
      "Shaka Player loaded successfully."
    );

    console.log(
      "MPD:",
      MPD_URL
    );

  } catch (error) {

    console.error(
      "Load failed:",
      error
    );

    setStatus(
      "Load failed: " +
      (error.code || error.message)
    );

  }

})();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forced HLS.js Plyr</title>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <style>
        body {
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <video id="player" controls crossorigin playsinline></video>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.0"></script>
<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const source = 'http://filex.me:8080/live/amin007007/nxKYVmQsTZ/1369002.m3u8';
        const video = document.getElementById('player');
        
        const defaultOptions = {
            controls: ['play-large', 'play', 'mute', 'volume', 'current-time', 'settings', 'pip', 'fullscreen'],
            settings: ['quality', 'speed']
        };

        if (Hls.isSupported()) {
            const hls = new Hls({
                maxMaxBufferLength: 10, // Optimizes buffer for live streams
                liveSyncDurationCount: 3
            });
            
            hls.loadSource(source);
            hls.attachMedia(video);
            
            // Forces Plyr to read quality levels provided directly by HLS.js
            hls.on(Hls.Events.MANIFEST_PARSED, function (event, data) {
                const availableQualities = hls.levels.map((l) => l.height);
                defaultOptions.quality = {
                    default: availableQualities[0],
                    options: availableQualities,
                    forced: true,
                    onChange: (e) => updateQuality(e),
                };
                new Plyr(video, defaultOptions);
            });

            function updateQuality(newQuality) {
                hls.levels.forEach((level, levelIndex) => {
                    if (level.height === newQuality) {
                        hls.currentLevel = levelIndex;
                    }
                });
            }
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            // Strict absolute fallback ONLY for iOS/Safari where hls.js cannot physically run
            video.src = source;
            new Plyr(video, defaultOptions);
        }
    });
</script>
</body>
</html>

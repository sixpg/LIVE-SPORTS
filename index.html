<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>dash plyr</title>

<script
src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"
crossorigin="anonymous">
</script>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css"
crossorigin="anonymous">

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  background: #000;
  overflow: hidden;
}

.shaka-video-container {
  position: fixed;
  inset: 0;
}

video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
}

.shaka-spinner-container,
.shaka-spinner,
.shaka-spinner-svg {
  display: none !important;
}

#error {
  position: fixed;
  inset: 0;

  display: flex;

  align-items: center;
  justify-content: center;

  padding: 25px;

  color: #ff4444;

  background: #000;

  font-family: system-ui, Arial, sans-serif;

  font-size: 14px;

  text-align: left;

  white-space: pre-wrap;

  overflow: auto;

  z-index: 99999;
}

</style>

</head>


<body>


<div
  id="error"
  style="display:none">
</div>


<div
  class="shaka-video-container"
  data-shaka-player>

  <video
    autoplay
    playsinline
    preload="metadata"
    poster="https://webiptv.site/weiptv.webp">
  </video>

</div>


<script>

/* =========================================================
   JSON CONFIGURATION
   ========================================================= */

const JSON_URL =
  "https://pasteking.u0k.workers.dev/5xqwz.json";


/* =========================================================
   LOAD JSON
   ========================================================= */

async function getStreamConfig() {

  console.log(
    "Loading JSON:",
    JSON_URL
  );


  const response =
    await fetch(
      JSON_URL,
      {
        method: "GET",
        cache: "no-store"
      }
    );


  console.log(
    "JSON HTTP status:",
    response.status
  );


  if (!response.ok) {

    throw new Error(
      "JSON request failed\n\n" +
      "HTTP Status: " +
      response.status
    );

  }


  const text =
    await response.text();


  console.log(
    "JSON response:",
    text
  );


  let data;


  try {

    data =
      JSON.parse(text);

  }

  catch (error) {

    throw new Error(
      "The JSON endpoint did not return valid JSON.\n\n" +
      error.message
    );

  }


  if (!data) {

    throw new Error(
      "JSON response is empty."
    );

  }


  if (
    typeof data.url !== "string" ||
    !data.url.trim()
  ) {

    throw new Error(
      "JSON is missing the 'url' field."
    );

  }


  if (
    !data.clearKeys ||
    typeof data.clearKeys !== "object"
  ) {

    throw new Error(
      "JSON is missing the 'clearKeys' object."
    );

  }


  const keyCount =
    Object.keys(
      data.clearKeys
    ).length;


  if (keyCount === 0) {

    throw new Error(
      "No ClearKey entries were found."
    );

  }


  console.log(
    "MPD:",
    data.url
  );


  console.log(
    "ClearKey count:",
    keyCount
  );


  return data;
}


/* =========================================================
   ERROR DISPLAY
   ========================================================= */

function showError(message) {

  const errorBox =
    document.getElementById(
      "error"
    );


  errorBox.textContent =
    message;


  errorBox.style.display =
    "flex";

}


/* =========================================================
   FORMAT SHAKA ERROR
   ========================================================= */

function formatShakaError(error) {

  let output =
    "STREAM LOAD FAILED\n\n";


  if (error) {

    if (error.code !== undefined) {

      output +=
        "Code: " +
        error.code +
        "\n";

    }


    if (error.category !== undefined) {

      output +=
        "Category: " +
        error.category +
        "\n";

    }


    if (error.severity !== undefined) {

      output +=
        "Severity: " +
        error.severity +
        "\n";

    }


    if (error.message) {

      output +=
        "Message: " +
        error.message +
        "\n";

    }


    if (error.data) {

      output +=
        "\nData:\n" +
        JSON.stringify(
          error.data,
          null,
          2
        ) +
        "\n";

    }


    if (error.stack) {

      output +=
        "\nStack:\n" +
        error.stack +
        "\n";

    }

  }


  return output;
}


/* =========================================================
   AUTOPLAY
   ========================================================= */

function autoplay(video) {

  video.muted = false;


  const promise =
    video.play();


  if (
    promise !== undefined
  ) {

    promise

      .then(() => {

        video.muted = false;

      })

      .catch(() => {

        video.muted = true;


        video.play()

          .then(() => {

            setTimeout(() => {

              video.muted = false;

            }, 300);

          })

          .catch(() => {

            console.log(
              "Autoplay was blocked."
            );

          });

      });

  }

}


/* =========================================================
   MAIN
   ========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  async () => {

    try {

      /* ---------------------------------------------------
         SHAKA POLYFILL
         --------------------------------------------------- */

      shaka.polyfill.installAll();


      /* ---------------------------------------------------
         BROWSER CHECK
         --------------------------------------------------- */

      if (
        !shaka.Player.isBrowserSupported()
      ) {

        showError(
          "This browser does not support Shaka Player."
        );

        return;

      }


      /* ---------------------------------------------------
         LOAD JSON
         --------------------------------------------------- */

      const params =
        await getStreamConfig();


      console.log(
        "Stream configuration:",
        params
      );


      /* ---------------------------------------------------
         VIDEO
         --------------------------------------------------- */

      const video =
        document.querySelector(
          "video"
        );


      /* ---------------------------------------------------
         PLAYER
         --------------------------------------------------- */

      const player =
        new shaka.Player(
          video
        );


      window.player =
        player;


      /* ---------------------------------------------------
         PLAYER ERROR EVENTS
         --------------------------------------------------- */

      player.addEventListener(
        "error",
        event => {

          console.error(
            "SHAKA ERROR EVENT:",
            event.detail
          );

          showError(
            formatShakaError(
              event.detail
            )
          );

        }
      );


      /* ---------------------------------------------------
         UI
         --------------------------------------------------- */

      const container =
        document.querySelector(
          ".shaka-video-container"
        );


      const ui =
        new shaka.ui.Overlay(
          player,
          container,
          video
        );


      ui.configure({

        controlPanelElements: [

          "play_pause",

          "time_and_duration",

          "mute",

          "volume",

          "spacer",

          "captions",

          "quality",

          "language",

          "picture_in_picture",

          "fullscreen"

        ],

        volumeBarColors: {

          base:
            "rgba(63, 187, 1, 1)",

          level:
            "rgb(255, 69, 0)"

        },

        seekBarColors: {

          base:
            "rgb(41, 41, 163)",

          buffered:
            "rgb(35, 99, 3)",

          played:
            "rgba(63, 187, 1, 1)"

        }

      });


      /* ---------------------------------------------------
         DRM + STREAMING CONFIG
         --------------------------------------------------- */

      player.configure({

        drm: {

          clearKeys:
            params.clearKeys

        },


        streaming: {

          lowLatencyMode:
            true,

          bufferingGoal:
            20,

          rebufferingGoal:
            5,

          bufferBehind:
            25,


          retryParameters: {

            timeout:
              8000,

            maxAttempts:
              5,

            baseDelay:
              300,

            backoffFactor:
              1.2

          },


          segmentRequestTimeout:
            7000,

          segmentPrefetchLimit:
            3,

          useNativeHlsOnSafari:
            true

        },


        manifest: {

          retryParameters: {

            timeout:
              8000,

            maxAttempts:
              3

          }

        }

      });


      /* ---------------------------------------------------
         LOAD MPD
         --------------------------------------------------- */

      console.log(
        "Loading MPD..."
      );


      console.log(
        params.url
      );


      await player.load(
        params.url
      );


      console.log(
        "MPD loaded successfully."
      );


      /* ---------------------------------------------------
         TRACK INFORMATION
         --------------------------------------------------- */

      console.log(
        "Variant tracks:",
        player.getVariantTracks()
      );


      console.log(
        "Text tracks:",
        player.getTextTracks()
      );


      /* ---------------------------------------------------
         START PLAYBACK
         --------------------------------------------------- */

      autoplay(
        video
      );

    }


    catch (error) {

      console.error(
        "PLAYER INITIALIZATION ERROR:",
        error
      );


      showError(
        formatShakaError(
          error
        )
      );

    }

  }
);

</script>

</body>

</html>

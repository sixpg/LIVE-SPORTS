<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DRM DASH Player</title>

  <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#000;
      overflow:hidden;
      font-family:Arial,sans-serif;
    }

    #player-container{
      width:100%;
      height:100vh;
      position:relative;
      background:#000;
    }

    video{
      width:100%;
      height:100%;
      background:#000;
    }

    #loading{
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%);
      color:#fff;
      font-size:20px;
      z-index:999;
    }

    #error{
      position:absolute;
      bottom:20px;
      left:20px;
      color:red;
      font-size:16px;
      z-index:999;
      max-width:90%;
      word-wrap:break-word;
    }
  </style>
</head>

<body>

<div id="player-container">

  <div id="loading">Loading Stream...</div>

  <div id="error"></div>

  <video
    id="videoPlayer"
    controls
    autoplay
    playsinline
  ></video>

</div>

<script>

(async () => {

  // ====================================
  // GET STREAM ID FROM URL
  // Example:
  // player.html?id=3122
  // player.html?id=Tnt1
  // ====================================

  const params = new URLSearchParams(window.location.search);

  const streamId = params.get("id");

  if (!streamId) {
    showError("No stream ID provided");
    return;
  }

  // ====================================
  // YOUR JSON API
  // ====================================

  const apiUrl =
    `https://footsters.playsportsapi.workers.dev/?id=${streamId}`;

  try {

    // ====================================
    // FETCH JSON
    // ====================================

    const response = await fetch(apiUrl);

    if (!response.ok) {
      throw new Error("Failed to fetch API");
    }

    const data = await response.json();

    console.log("FULL API RESPONSE:", data);

    // ====================================
    // IMPORTANT FIX
    // YOUR JSON FORMAT:
    //
    // {
    //   "3122": { ... }
    // }
    //
    // SO WE MUST ACCESS:
    // data[streamId]
    // ====================================

    const stream = data[streamId];

    if (!stream) {
      throw new Error("Stream not found in JSON");
    }

    // ====================================
    // VALIDATION
    // ====================================

    if (!stream.url) {
      throw new Error("MPD URL missing");
    }

    if (!stream.keys) {
      throw new Error("DRM Keys missing");
    }

    // ====================================
    // VIDEO
    // ====================================

    const video =
      document.getElementById("videoPlayer");

    if (stream.poster && stream.poster !== "") {
      video.poster = stream.poster;
    }

    // ====================================
    // DASH PLAYER
    // ====================================

    const player =
      dashjs.MediaPlayer().create();

    // CLEARKEY DRM
    player.setProtectionData({
      "org.w3.clearkey": {
        clearkeys: stream.keys
      }
    });

    // PLAYER SETTINGS
    player.updateSettings({
      streaming: {
        lowLatencyEnabled: true,
        fastSwitchEnabled: true
      }
    });

    // INIT PLAYER
    player.initialize(
      video,
      stream.url,
      true
    );

    // ====================================
    // EVENTS
    // ====================================

    player.on(
      dashjs.MediaPlayer.events.STREAM_INITIALIZED,
      () => {

        console.log("Playback Started");

        document.getElementById("loading")
          .style.display = "none";
      }
    );

    player.on(
      dashjs.MediaPlayer.events.ERROR,
      (e) => {

        console.error("DASH ERROR:", e);

        showError("Playback Error");

        document.getElementById("loading")
          .style.display = "none";
      }
    );

  } catch (err) {

    console.error(err);

    showError(err.message);

    document.getElementById("loading")
      .style.display = "none";
  }

  // ====================================
  // ERROR FUNCTION
  // ====================================

  function showError(msg) {

    document.getElementById("error")
      .innerText = msg;
  }

})();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HLS Live Stream Player</title>
    
    <!-- Plyr CSS CDN -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    
    <style>
        body {
            background-color: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Video Element -->
    <video id="player" controls crossorigin playsinline></video>
</div>

<!-- hls.js CDN (Handles the stream decoding) -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<!-- Plyr JS CDN (Handles the beautiful UI) -->
<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const source = 'http://filex.me:8080/live/amin007007/nxKYVmQsTZ/1369002.m3u8';
        const video = document.getElementById('player');
        
        // Configuration options for Plyr UI
        const defaultOptions = {
            controls: [
                'play-large', 'play', 'mute', 'volume', 
                'current-time', 'settings', 'pip', 'airplay', 'fullscreen'
            ],
            settings: ['quality', 'speed', 'loop']
        };

        if (!Hls.isSupported()) {
            // Fallback for Safari/iOS which support HLS natively
            video.src = source;
            const player = new Plyr(video, defaultOptions);
        } else {
            // For Chrome, Firefox, Edge, etc. -> use hls.js
            const hls = new Hls();
            hls.loadSource(source);
            hls.attachMedia(video);
            
            hls.on(Hls.Events.MANIFEST_PARSED, function () {
                // Initialize Plyr once the HLS manifest is loaded
                const player = new Plyr(video, defaultOptions);
            });
        }
    </script>
</body>
</html>

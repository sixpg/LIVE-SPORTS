<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>dash plyr</title>

<script
src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"
crossorigin="anonymous">
</script>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css"
crossorigin="anonymous">

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  height: 100%;
  background: #000;
  overflow: hidden;
}

.shaka-video-container {
  position: fixed;
  inset: 0;
}

video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
}

.shaka-spinner-container,
.shaka-spinner,
.shaka-spinner-svg {
  display: none !important;
}

#error {
  position: fixed;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  color: #ff4444;
  font-family: system-ui;

  padding: 20px;
  text-align: center;

  white-space: pre-wrap;

  z-index: 9999;
}

</style>

</head>


<body>


<div id="error" style="display:none"></div>


<div
  class="shaka-video-container"
  data-shaka-player
>

  <video
    autoplay
    playsinline
    preload="metadata"
    poster="https://webiptv.site/weiptv.webp">
  </video>

</div>


<script>

/* =========================================================
   JSON SOURCE
   ========================================================= */

const JSON_URL =
  "https://pasteking.u0k.workers.dev/5xqwz.json";


/* =========================================================
   LOAD JSON
   ========================================================= */

async function getStreamConfig() {

  const response = await fetch(
    JSON_URL,
    {
      method: "GET",
      cache: "no-store"
    }
  );


  if (!response.ok) {

    throw new Error(
      "JSON request failed: HTTP " +
      response.status
    );

  }


  const data = await response.json();


  if (!data || typeof data !== "object") {

    throw new Error(
      "Invalid JSON response"
    );

  }


  if (!data.url) {

    throw new Error(
      "JSON does not contain a 'url' field"
    );

  }


  if (
    !data.clearKeys ||
    typeof data.clearKeys !== "object"
  ) {

    throw new Error(
      "JSON does not contain a valid 'clearKeys' object"
    );

  }


  return data;
}


/* =========================================================
   PLAYER
   ========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  async () => {


    shaka.polyfill.installAll();


    if (!shaka.Player.isBrowserSupported()) {

      return showError(
        "Browser not supported"
      );

    }


    /* -----------------------------------------------------
       GET MPD + CLEARKEY FROM JSON
       ----------------------------------------------------- */

    let params;


    try {

      params =
        await getStreamConfig();

      console.log(
        "JSON configuration:",
        params
      );

    }

    catch (e) {

      console.error(
        "JSON loading error:",
        e
      );

      return showError(
        "Failed to load stream configuration\n\n" +
        e.message
      );

    }


    /* -----------------------------------------------------
       VIDEO
       ----------------------------------------------------- */

    const video =
      document.querySelector("video");


    /* -----------------------------------------------------
       SHAKA PLAYER
       ----------------------------------------------------- */

    const player =
      new shaka.Player(video);


    window.player =
      player;


    /* -----------------------------------------------------
       UI
       ----------------------------------------------------- */

    const container =
      document.querySelector(
        ".shaka-video-container"
      );


    const ui =
      new shaka.ui.Overlay(
        player,
        container,
        video
      );


    ui.configure({

      controlPanelElements: [

        "play_pause",

        "time_and_duration",

        "mute",

        "volume",

        "spacer",

        "captions",

        "quality",

        "language",

        "picture_in_picture",

        "fullscreen"

      ],

      volumeBarColors: {

        base:
          "rgba(63, 187, 1, 1)",

        level:
          "rgb(255, 69, 0)"

      },

      seekBarColors: {

        base:
          "rgb(41, 41, 163)",

        buffered:
          "rgb(35, 99, 3)",

        played:
          "rgba(63, 187, 1, 1)"

      }

    });


    /* -----------------------------------------------------
       SHAKA CONFIGURATION
       ----------------------------------------------------- */

    player.configure({

      drm: {

        clearKeys:
          params.clearKeys

      },


      streaming: {

        lowLatencyMode:
          true,

        bufferingGoal:
          20,

        rebufferingGoal:
          5,

        bufferBehind:
          25,


        retryParameters: {

          timeout:
            8000,

          maxAttempts:
            5,

          baseDelay:
            300,

          backoffFactor:
            1.2

        },


        segmentRequestTimeout:
          7000,

        segmentPrefetchLimit:
          3,

        useNativeHlsOnSafari:
          true

      },


      manifest: {

        retryParameters: {

          timeout:
            8000,

          maxAttempts:
            3

        }

      }

    });


    /* -----------------------------------------------------
       LOAD MPD
       ----------------------------------------------------- */

    try {

      console.log(
        "Loading MPD:",
        params.url
      );


      await player.load(
        params.url
      );


      console.log(
        "Stream loaded successfully"
      );


      autoplay(video);

    }


    catch (e) {

      console.error(
        "Stream load failed:",
        e
      );


      showError(
        "Stream load failed\n\n" +
        (
          e.message ||
          String(e)
        )
      );

    }


    /* -----------------------------------------------------
       AUTOPLAY
       ----------------------------------------------------- */

    function autoplay(v) {

      v.muted = false;


      const p =
        v.play();


      if (p !== undefined) {

        p.then(() => {

          v.muted = false;

        })


        .catch(() => {

          v.muted = true;


          v.play()

            .then(() => {

              setTimeout(() => {

                v.muted = false;

              }, 300);

            })

            .catch(() => {});

        });

      }

    }


    /* -----------------------------------------------------
       ERROR
       ----------------------------------------------------- */

    function showError(msg) {

      const e =
        document.getElementById(
          "error"
        );


      e.textContent =
        msg;


      e.style.display =
        "flex";

    }

  }
);

</script>


<!-- Anti-debugging -->

<script src="https://cdn.jsdelivr.net/npm/disable-devtool@latest">
</script>

<script>

DisableDevtool({

  disable: true,

  disableMenu: true,

  clearLog: true,

  disableSelect: true,

  disableCopy: true,

  disableCut: true,

  disablePaste: true,

  interval: 10,

  disableMobile: true,

  ondevtoolopen: function () {

    window.location.href =
      "about:blank";

  }

});

</script>


</body>

</html>

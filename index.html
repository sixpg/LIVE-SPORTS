<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DRM Player</title>

  <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>

  <style>
    body {
      margin: 0;
      background: #000;
      font-family: Arial, sans-serif;
      color: white;
    }

    #player-container {
      width: 100%;
      height: 100vh;
      position: relative;
      background: black;
    }

    video {
      width: 100%;
      height: 100%;
      background: black;
    }

    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 18px;
    }
  </style>
</head>
<body>

<div id="player-container">
  <div class="loading" id="loading">Loading Stream...</div>

  <video id="videoPlayer" controls autoplay playsinline></video>
</div>

<script>
(async () => {

  // =========================
  // GET ID FROM URL
  // Example:
  // ?id=3121
  // =========================

  const params = new URLSearchParams(window.location.search);
  const streamId = params.get("id");

  if (!streamId) {
    alert("No stream ID provided");
    return;
  }

  // =========================
  // JSON URL
  // =========================

  const jsonUrl = "https://footsters.playsportsapi.workers.dev/";

  try {

    // Fetch JSON
    const response = await fetch(jsonUrl);
    const data = await response.json();

    // Find stream by ID
    const stream = data[streamId];

    if (!stream) {
      alert("Stream not found");
      return;
    }

    const video = document.getElementById("videoPlayer");

    // Poster
    if (stream.poster) {
      video.poster = stream.poster;
    }

    // =========================
    // DASH.JS PLAYER
    // =========================

    const player = dashjs.MediaPlayer().create();

    // Convert keys to ClearKey format
    const clearkeys = {};

    for (const kid in stream.keys) {
      clearkeys[kid] = stream.keys[kid];
    }

    player.setProtectionData({
      "org.w3.clearkey": {
        clearkeys: clearkeys
      }
    });

    player.initialize(video, stream.url, true);

    // Hide loading after playback starts
    player.on(dashjs.MediaPlayer.events.STREAM_INITIALIZED, function () {
      document.getElementById("loading").style.display = "none";
    });

    // Error handling
    player.on(dashjs.MediaPlayer.events.ERROR, function(e) {
      console.error("DASH Error:", e);
    });

  } catch (err) {
    console.error(err);
    alert("Failed to load stream");
  }

})();
</script>

</body>
</html>

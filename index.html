<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shaka Player – Bufferless ClearKey (Netflix UI)</title>
  <!-- Shaka Player (compiled + UI) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.2/shaka-player.compiled.js"></script>
  <style>
    :root {
      --netflix-red: #e50914;
      --netflix-dark: #141414;
      --netflix-gray: #808080;
      --control-h: 56px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      color: #fff;
      font-family: "Netflix Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 40px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 18px;
      letter-spacing: 0.5px;
    }

    .setup {
      width: 100%;
      max-width: 960px;
      background: #1a1a1a;
      border-radius: 8px;
      padding: 18px 20px;
      margin-bottom: 24px;
      border: 1px solid #333;
    }

    .setup label {
      display: block;
      font-size: 0.85rem;
      color: #b3b3b3;
      margin-bottom: 6px;
    }

    .setup input[type="text"],
    .setup textarea {
      width: 100%;
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      border-radius: 4px;
      padding: 10px 12px;
      font-size: 0.9rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      margin-bottom: 14px;
      resize: vertical;
    }

    .setup textarea { min-height: 110px; line-height: 1.45; }

    .setup input:focus,
    .setup textarea:focus {
      outline: none;
      border-color: var(--netflix-red);
    }

    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button.primary {
      background: var(--netflix-red);
      color: #fff;
      border: none;
      padding: 10px 22px;
      border-radius: 4px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button.primary:hover { background: #f40612; }
    button.primary:disabled {
      background: #555;
      cursor: not-allowed;
    }

    button.secondary {
      background: transparent;
      color: #fff;
      border: 1px solid #666;
      padding: 10px 18px;
      border-radius: 4px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    button.secondary:hover { border-color: #aaa; }

    /* ===== PLAYER CONTAINER ===== */
    .player-wrapper {
      width: 100%;
      max-width: 960px;
      position: relative;
      background: #000;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,0.7);
      aspect-ratio: 16 / 9;
    }

    .player-wrapper video {
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
      object-fit: contain;
    }

    /* Netflix-style overlay */
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease;
      background: linear-gradient(
        to top,
        rgba(0,0,0,0.85) 0%,
        rgba(0,0,0,0.4) 30%,
        transparent 55%
      );
    }

    .player-wrapper:hover .overlay,
    .player-wrapper.show-controls .overlay,
    .player-wrapper.paused .overlay {
      opacity: 1;
      pointer-events: auto;
    }

    /* Big center play button */
    .big-play {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(0,0,0,0.55);
      border: 2px solid rgba(255,255,255,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      pointer-events: auto;
      transition: transform 0.15s, background 0.15s;
    }
    .big-play:hover {
      transform: translate(-50%, -50%) scale(1.08);
      background: rgba(229,9,20,0.85);
      border-color: #fff;
    }
    .big-play svg { width: 32px; height: 32px; fill: #fff; margin-left: 3px; }
    .player-wrapper:not(.paused) .big-play { display: none; }

    /* Bottom control bar */
    .controls {
      padding: 0 16px 14px;
      pointer-events: auto;
    }

    /* Progress / seek bar */
    .progress-wrap {
      position: relative;
      height: 4px;
      background: rgba(255,255,255,0.25);
      border-radius: 2px;
      cursor: pointer;
      margin-bottom: 12px;
      transition: height 0.12s;
    }
    .progress-wrap:hover { height: 6px; }

    .buffered {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      background: rgba(255,255,255,0.35);
      border-radius: 2px;
      width: 0%;
      pointer-events: none;
    }

    .played {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      background: var(--netflix-red);
      border-radius: 2px;
      width: 0%;
      pointer-events: none;
    }

    .progress-wrap:hover .played::after {
      content: "";
      position: absolute;
      right: -6px;
      top: 50%;
      transform: translateY(-50%);
      width: 12px;
      height: 12px;
      background: var(--netflix-red);
      border-radius: 50%;
      box-shadow: 0 0 4px rgba(0,0,0,0.5);
    }

    /* Button row */
    .btn-bar {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .ctrl-btn {
      background: transparent;
      border: none;
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s;
    }
    .ctrl-btn:hover { background: rgba(255,255,255,0.15); }
    .ctrl-btn svg { width: 22px; height: 22px; fill: currentColor; }

    .time-display {
      font-size: 0.85rem;
      color: #e5e5e5;
      margin-left: 8px;
      font-variant-numeric: tabular-nums;
      min-width: 110px;
    }

    .spacer { flex: 1; }

    /* Volume */
    .volume-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .volume-slider {
      width: 0;
      overflow: hidden;
      transition: width 0.2s;
    }
    .volume-wrap:hover .volume-slider { width: 80px; }
    .volume-slider input[type="range"] {
      width: 80px;
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255,255,255,0.3);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }
    .volume-slider input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
    }

    /* Quality / settings dropdown */
    .dropdown {
      position: relative;
    }
    .dropdown-menu {
      position: absolute;
      bottom: 48px;
      right: 0;
      background: rgba(28,28,28,0.95);
      border: 1px solid #444;
      border-radius: 4px;
      min-width: 160px;
      padding: 8px 0;
      display: none;
      z-index: 20;
      backdrop-filter: blur(8px);
    }
    .dropdown.open .dropdown-menu { display: block; }
    .dropdown-menu button {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      color: #fff;
      padding: 8px 16px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .dropdown-menu button:hover { background: rgba(255,255,255,0.1); }
    .dropdown-menu button.active { color: var(--netflix-red); font-weight: 600; }

    /* Loading spinner */
    .spinner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 48px;
      height: 48px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: var(--netflix-red);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
      z-index: 10;
    }
    .player-wrapper.buffering .spinner { display: block; }
    @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

    /* Status / error */
    .status {
      width: 100%;
      max-width: 960px;
      margin-top: 14px;
      font-size: 0.85rem;
      color: #aaa;
      min-height: 1.2em;
    }
    .status.error { color: #ff6b6b; }

    /* Hint */
    .hint {
      font-size: 0.78rem;
      color: #666;
      margin-top: 8px;
      line-height: 1.4;
    }

    /* Fullscreen adjustments */
    .player-wrapper:fullscreen,
    .player-wrapper:-webkit-full-screen {
      max-width: none;
      border-radius: 0;
      aspect-ratio: auto;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <h1>Shaka Player · Bufferless ClearKey · Netflix UI</h1>

  <div class="setup">
    <label for="mpdUrl">MPD / DASH URL</label>
    <input type="text" id="mpdUrl" placeholder="https://example.com/stream.mpd" />

    <label for="clearKeys">ClearKeys (one per line: kid:key in hex)</label>
    <textarea id="clearKeys" placeholder="a6be88ea454c43bcb4affec1466898c5:089c7fb2126748ca921ec700169a1a84
280c2e7c65bf40d7a048d90d5ea03d82:fc67e9582bf943de8567cf835b0608c2
..."></textarea>

    <div class="btn-row">
      <button class="primary" id="loadBtn">Load &amp; Play</button>
      <button class="secondary" id="stopBtn">Stop</button>
      <button class="secondary" id="fillExample">Fill Example Keys</button>
    </div>
    <p class="hint">
      Low-buffer mode is active (bufferingGoal ≈ 4 s, rebufferingGoal ≈ 1 s).  
      Multiple ClearKeys are injected via <code>drm.clearKeys</code>. Works best in Chrome / Edge / Firefox.
    </p>
  </div>

  <div class="player-wrapper paused" id="playerWrapper">
    <video id="video" playsinline></video>
    <div class="spinner" id="spinner"></div>

    <div class="overlay" id="overlay">
      <!-- Big center play -->
      <div class="big-play" id="bigPlay" title="Play">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>

      <div class="controls">
        <!-- Seek bar -->
        <div class="progress-wrap" id="progressWrap">
          <div class="buffered" id="bufferedBar"></div>
          <div class="played" id="playedBar"></div>
        </div>

        <div class="btn-bar">
          <!-- Play / Pause -->
          <button class="ctrl-btn" id="playPauseBtn" title="Play/Pause">
            <svg id="iconPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg id="iconPause" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>

          <!-- Rewind 10s -->
          <button class="ctrl-btn" id="rewindBtn" title="Rewind 10s">
            <svg viewBox="0 0 24 24"><path d="M12.5 3C17.15 3 21 6.85 21 11.5S17.15 20 12.5 20 4 16.15 4 11.5c0-1.56.43-3.03 1.18-4.3L2 4.5 5.5 8H12V3.5c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5h2c0 3.87-3.13 7-7 7s-7-3.13-7-7 3.13-7 7-7z"/><text x="9" y="15" font-size="7" fill="currentColor" font-family="sans-serif">10</text></svg>
          </button>

          <!-- Forward 10s -->
          <button class="ctrl-btn" id="forwardBtn" title="Forward 10s">
            <svg viewBox="0 0 24 24"><path d="M11.5 3C6.85 3 3 6.85 3 11.5S6.85 20 11.5 20 20 16.15 20 11.5c0-1.56-.43-3.03-1.18-4.3L22 4.5 18.5 8H12V3.5c2.76 0 5 2.24 5 5s-2.24 5-5 5-5-2.24-5-5h-2c0 3.87 3.13 7 7 7s7-3.13 7-7-3.13-7-7-7z"/><text x="8" y="15" font-size="7" fill="currentColor" font-family="sans-serif">10</text></svg>
          </button>

          <div class="volume-wrap">
            <button class="ctrl-btn" id="muteBtn" title="Mute">
              <svg id="iconVol" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
              <svg id="iconMuted" viewBox="0 0 24 24" style="display:none"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
            </button>
            <div class="volume-slider">
              <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="1" />
            </div>
          </div>

          <span class="time-display" id="timeDisplay">0:00 / 0:00</span>

          <div class="spacer"></div>

          <!-- Quality -->
          <div class="dropdown" id="qualityDropdown">
            <button class="ctrl-btn" id="qualityBtn" title="Quality">
              <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87a.49.49 0 0 0 .12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
            </button>
            <div class="dropdown-menu" id="qualityMenu"></div>
          </div>

          <!-- Fullscreen -->
          <button class="ctrl-btn" id="fsBtn" title="Fullscreen">
            <svg id="iconFs" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
            <svg id="iconFsExit" viewBox="0 0 24 24" style="display:none"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="status" id="status"></div>

  <script>
    // ---------- Example keys from user ----------
    const EXAMPLE_KEYS = `a6be88ea454c43bcb4affec1466898c5:089c7fb2126748ca921ec700169a1a84
280c2e7c65bf40d7a048d90d5ea03d82:fc67e9582bf943de8567cf835b0608c2
79ed755f8949459a9469e2e5201db84b:fa70a243e0c04afe97f557871979b390
e13f038261b9486abbd0b11e48d9d4d9:37c7f6f9a2e2403da1e63bd981626b88`;

    // ---------- DOM ----------
    const video          = document.getElementById('video');
    const wrapper        = document.getElementById('playerWrapper');
    const mpdUrlInput    = document.getElementById('mpdUrl');
    const clearKeysInput = document.getElementById('clearKeys');
    const loadBtn        = document.getElementById('loadBtn');
    const stopBtn        = document.getElementById('stopBtn');
    const fillExampleBtn = document.getElementById('fillExample');
    const statusEl       = document.getElementById('status');
    const playPauseBtn   = document.getElementById('playPauseBtn');
    const iconPlay       = document.getElementById('iconPlay');
    const iconPause      = document.getElementById('iconPause');
    const bigPlay        = document.getElementById('bigPlay');
    const rewindBtn      = document.getElementById('rewindBtn');
    const forwardBtn     = document.getElementById('forwardBtn');
    const muteBtn        = document.getElementById('muteBtn');
    const iconVol        = document.getElementById('iconVol');
    const iconMuted      = document.getElementById('iconMuted');
    const volumeSlider   = document.getElementById('volumeSlider');
    const timeDisplay    = document.getElementById('timeDisplay');
    const progressWrap   = document.getElementById('progressWrap');
    const playedBar      = document.getElementById('playedBar');
    const bufferedBar    = document.getElementById('bufferedBar');
    const qualityBtn     = document.getElementById('qualityBtn');
    const qualityMenu    = document.getElementById('qualityMenu');
    const qualityDropdown= document.getElementById('qualityDropdown');
    const fsBtn          = document.getElementById('fsBtn');
    const iconFs         = document.getElementById('iconFs');
    const iconFsExit     = document.getElementById('iconFsExit');

    let player = null;
    let hideControlsTimer = null;

    // ---------- Helpers ----------
    function setStatus(msg, isError = false) {
      statusEl.textContent = msg;
      statusEl.className = 'status' + (isError ? ' error' : '');
    }

    function parseClearKeys(text) {
      const map = {};
      text.split(/\r?\n/).forEach(line => {
        line = line.trim();
        if (!line || line.startsWith('#')) return;
        const parts = line.split(':');
        if (parts.length >= 2) {
          const kid = parts[0].trim().toLowerCase().replace(/-/g, '');
          const key = parts.slice(1).join(':').trim().toLowerCase().replace(/-/g, '');
          if (kid && key) map[kid] = key;
        }
      });
      return map;
    }

    function formatTime(s) {
      if (!isFinite(s) || s < 0) return '0:00';
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = Math.floor(s % 60);
      if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
      return `${m}:${String(sec).padStart(2,'0')}`;
    }

    function updatePlayPauseUI() {
      const paused = video.paused;
      wrapper.classList.toggle('paused', paused);
      iconPlay.style.display  = paused ? 'block' : 'none';
      iconPause.style.display = paused ? 'none'  : 'block';
    }

    function updateVolumeUI() {
      const muted = video.muted || video.volume === 0;
      iconVol.style.display   = muted ? 'none'  : 'block';
      iconMuted.style.display = muted ? 'block' : 'none';
      volumeSlider.value = muted ? 0 : video.volume;
    }

    function updateProgress() {
      const dur = video.duration || 0;
      const cur = video.currentTime || 0;
      playedBar.style.width = dur ? (cur / dur * 100) + '%' : '0%';

      // Buffered ranges
      if (video.buffered.length) {
        const end = video.buffered.end(video.buffered.length - 1);
        bufferedBar.style.width = dur ? (end / dur * 100) + '%' : '0%';
      } else {
        bufferedBar.style.width = '0%';
      }

      timeDisplay.textContent = `${formatTime(cur)} / ${formatTime(dur)}`;
    }

    function showControlsTemporarily() {
      wrapper.classList.add('show-controls');
      clearTimeout(hideControlsTimer);
      hideControlsTimer = setTimeout(() => {
        if (!video.paused) wrapper.classList.remove('show-controls');
      }, 3000);
    }

    // ---------- Shaka init ----------
    async function initPlayer() {
      if (!window.shaka) {
        setStatus('Shaka Player failed to load from CDN.', true);
        return;
      }
      shaka.polyfill.installAll();

      if (player) {
        await player.destroy();
        player = null;
      }

      player = new shaka.Player();
      await player.attach(video);

      // === BUFFERLESS / LOW-BUFFER CONFIG ===
      player.configure({
        streaming: {
          bufferingGoal: 4,          // try to keep only ~4 s ahead
          rebufferingGoal: 1,        // resume when 1 s is buffered
          bufferBehind: 10,          // keep little history
          retryParameters: {
            maxAttempts: 4,
            baseDelay: 200,
            backoffFactor: 1.5,
            fuzzFactor: 0.3,
            timeout: 10000
          },
          alwaysStreamText: false,
          segmentPrefetchLimit: 1
        },
        abr: {
          enabled: true,
          defaultBandwidthEstimate: 5e6
        },
        manifest: {
          retryParameters: {
            maxAttempts: 3,
            baseDelay: 300,
            timeout: 10000
          }
        }
      });

      // Error handler
      player.addEventListener('error', (e) => {
        const err = e.detail;
        console.error('Shaka error', err);
        setStatus(`Error ${err.code}: ${err.message || JSON.stringify(err.data)}`, true);
        wrapper.classList.remove('buffering');
      });

      // Buffering state
      player.addEventListener('buffering', (e) => {
        wrapper.classList.toggle('buffering', e.buffering);
      });
    }

    // ---------- Load stream ----------
    async function loadStream() {
      const url = mpdUrlInput.value.trim();
      if (!url) {
        setStatus('Please enter an MPD URL.', true);
        return;
      }

      const clearKeys = parseClearKeys(clearKeysInput.value);
      const keyCount = Object.keys(clearKeys).length;

      loadBtn.disabled = true;
      setStatus(`Loading… (${keyCount} ClearKey${keyCount !== 1 ? 's' : ''})`);
      wrapper.classList.add('buffering');

      try {
        if (!player) await initPlayer();

        // Inject ClearKeys (forces ClearKey CDM)
        if (keyCount > 0) {
          player.configure({
            drm: {
              clearKeys: clearKeys
            }
          });
        } else {
          // Clear any previous keys
          player.configure({ drm: { clearKeys: {} } });
        }

        await player.load(url);
        setStatus(`Playing · ${keyCount} ClearKey(s) loaded · low-buffer mode`);
        video.play().catch(() => {});
        updatePlayPauseUI();
        buildQualityMenu();
      } catch (err) {
        console.error(err);
        setStatus(`Load failed: ${err.message || err}`, true);
      } finally {
        loadBtn.disabled = false;
        wrapper.classList.remove('buffering');
      }
    }

    async function stopStream() {
      if (player) {
        await player.unload();
      }
      video.removeAttribute('src');
      video.load();
      setStatus('Stopped');
      updatePlayPauseUI();
      updateProgress();
      qualityMenu.innerHTML = '';
    }

    // ---------- Quality menu ----------
    function buildQualityMenu() {
      qualityMenu.innerHTML = '';
      if (!player) return;

      const tracks = player.getVariantTracks()
        .filter(t => t.height)
        .sort((a, b) => b.height - a.height);

      // Auto
      const autoBtn = document.createElement('button');
      autoBtn.textContent = 'Auto';
      autoBtn.classList.add('active');
      autoBtn.onclick = () => {
        player.configure({ abr: { enabled: true } });
        [...qualityMenu.children].forEach(b => b.classList.remove('active'));
        autoBtn.classList.add('active');
        qualityDropdown.classList.remove('open');
      };
      qualityMenu.appendChild(autoBtn);

      const seen = new Set();
      tracks.forEach(t => {
        const label = `${t.height}p`;
        if (seen.has(label)) return;
        seen.add(label);
        const btn = document.createElement('button');
        btn.textContent = label + (t.bandwidth ? ` · ${Math.round(t.bandwidth/1000)} kbps` : '');
        btn.onclick = () => {
          player.configure({ abr: { enabled: false } });
          player.selectVariantTrack(t, /* clearBuffer= */ true);
          [...qualityMenu.children].forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          qualityDropdown.classList.remove('open');
        };
        qualityMenu.appendChild(btn);
      });
    }

    // ---------- Event wiring ----------
    loadBtn.addEventListener('click', loadStream);
    stopBtn.addEventListener('click', stopStream);
    fillExampleBtn.addEventListener('click', () => {
      clearKeysInput.value = EXAMPLE_KEYS;
    });

    playPauseBtn.addEventListener('click', () => {
      if (video.paused) video.play();
      else video.pause();
    });
    bigPlay.addEventListener('click', () => video.play());

    video.addEventListener('play',  updatePlayPauseUI);
    video.addEventListener('pause', updatePlayPauseUI);
    video.addEventListener('timeupdate', updateProgress);
    video.addEventListener('progress', updateProgress);
    video.addEventListener('volumechange', updateVolumeUI);

    rewindBtn.addEventListener('click', () => {
      video.currentTime = Math.max(0, video.currentTime - 10);
    });
    forwardBtn.addEventListener('click', () => {
      video.currentTime = Math.min(video.duration || 0, video.currentTime + 10);
    });

    muteBtn.addEventListener('click', () => {
      video.muted = !video.muted;
    });
    volumeSlider.addEventListener('input', () => {
      video.volume = parseFloat(volumeSlider.value);
      video.muted = video.volume === 0;
    });

    // Seek
    progressWrap.addEventListener('click', (e) => {
      const rect = progressWrap.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      if (video.duration) video.currentTime = pct * video.duration;
    });

    // Quality dropdown
    qualityBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      qualityDropdown.classList.toggle('open');
    });
    document.addEventListener('click', () => qualityDropdown.classList.remove('open'));

    // Fullscreen
    fsBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        wrapper.requestFullscreen?.() || wrapper.webkitRequestFullscreen?.();
      } else {
        document.exitFullscreen?.() || document.webkitExitFullscreen?.();
      }
    });
    document.addEventListener('fullscreenchange', () => {
      const isFs = !!document.fullscreenElement;
      iconFs.style.display     = isFs ? 'none'  : 'block';
      iconFsExit.style.display = isFs ? 'block' : 'none';
    });

    // Show controls on interaction
    wrapper.addEventListener('mousemove', showControlsTemporarily);
    wrapper.addEventListener('touchstart', showControlsTemporarily);

    // Keyboard shortcuts (Netflix-ish)
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      switch (e.key) {
        case ' ':
        case 'k':
          e.preventDefault();
          video.paused ? video.play() : video.pause();
          break;
        case 'ArrowLeft':
          e.preventDefault();
          video.currentTime = Math.max(0, video.currentTime - 10);
          break;
        case 'ArrowRight':
          e.preventDefault();
          video.currentTime = Math.min(video.duration || 0, video.currentTime + 10);
          break;
        case 'm':
          video.muted = !video.muted;
          break;
        case 'f':
          fsBtn.click();
          break;
      }
    });

    // Boot
    initPlayer().then(() => {
      setStatus('Ready – paste MPD URL + ClearKeys and hit Load');
      clearKeysInput.value = EXAMPLE_KEYS; // pre-fill the keys you gave
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <title>Shoeb Player | Netflix Style</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Netflix Skin CSS (SnehTV wala) -->
    <link rel="stylesheet" href="https://tulnit.fun/player.css" />
    <script src="https://content.jwplatform.com/libraries/IDzF9Zmk.js"></script>

    <style>
        html, body {
            background: #000;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #myElement {
            width: 100% !important;
            height: 100% !important;
        }

        .jw-skin-netflix .jw-display-icon-container {
            border-radius: 50%;
        }

        .jw-title-primary,
        .jw-title-secondary {
            display: none !important;
        }

        .jw-skip {
            background: rgba(0,0,0,0.7) !important;
            border: 1px solid rgba(255,255,255,0.5) !important;
            color: #fff !important;
            padding: 10px 20px !important;
            border-radius: 4px !important;
            font-size: 14px !important;
            font-weight: 600 !important;
        }

        #playerError {
            display: none;
            box-sizing: border-box;
            color: #fff;
            background: #111;
            padding: 20px;
            font: 15px/1.5 Arial, sans-serif;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>
    <div id="myElement"></div>
    <div id="playerError" role="alert"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const playerElement = document.getElementById('myElement');
            const errorElement = document.getElementById('playerError');

            function showError(message) {
                playerElement.style.display = 'none';
                errorElement.textContent = message;
                errorElement.style.display = 'block';
            }

            const params = new URLSearchParams(window.location.search);
            const mpd = params.get('mpd');

            if (!mpd) {
                showError('Missing MPD URL. Add ?mpd=YOUR_STREAM.mpd to the page URL.');
                return;
            }

            let streamURL;

            try {
                streamURL = new URL(mpd);

                if (!['http:', 'https:'].includes(streamURL.protocol)) {
                    throw new Error('Invalid protocol');
                }
            } catch (error) {
                showError('The MPD URL is invalid.');
                return;
            }

            // Parse ClearKey parameters.
            // Format: ?mpd=...&keyid=KID1,KID2&key=KEY1,KEY2
            // Alternative: ?mpd=...&keys=KID1:KEY1,KID2:KEY2
            const keyIds = (params.get('keyid') || '')
                .split(',').map(v => v.trim()).filter(Boolean);

            const keys = (params.get('key') || '')
                .split(',').map(v => v.trim()).filter(Boolean);

            const combinedKeys = params.get('keys');
            const clearKeys = {};

            function isHexKey(value) {
                return /^[a-fA-F0-9]{32}$/.test(value);
            }

            if (combinedKeys) {
                for (const pair of combinedKeys.split(',')) {
                    const separator = pair.indexOf(':');

                    if (separator <= 0) {
                        showError('Invalid keys format. Expected KID:KEY,KID:KEY.');
                        return;
                    }

                    const kid = pair.slice(0, separator).trim();
                    const key = pair.slice(separator + 1).trim();

                    if (!isHexKey(kid) || !isHexKey(key)) {
                        showError('Each KID and key must contain 32 hexadecimal characters.');
                        return;
                    }

                    clearKeys[kid.toLowerCase()] = key.toLowerCase();
                }
            } else {
                if (keyIds.length !== keys.length) {
                    showError('The number of keyid and key values must match.');
                    return;
                }

                for (let i = 0; i < keyIds.length; i++) {
                    if (!isHexKey(keyIds[i]) || !isHexKey(keys[i])) {
                        showError('Each KID and key must contain 32 hexadecimal characters.');
                        return;
                    }

                    clearKeys[keyIds[i].toLowerCase()] =
                        keys[i].toLowerCase();
                }
            }

            // Ensure the JW Player library loaded.
            if (typeof window.jwplayer !== 'function') {
                showError('JW Player failed to load. Check the library URL, network connection, or browser console.');
                return;
            }

            const playerConfig = {
                title: '',
                description: '',
                skin: { name: 'netflix' },
                stretching: 'exactfit',
                aspectratio: '16:9',
                width: '100%',
                height: '100%',
                autostart: true,
                file: streamURL.href,
                type: 'dash'
            };

            if (Object.keys(clearKeys).length > 0) {
                const kids = Object.keys(clearKeys);

                // Preserve the original single-key JW Player configuration.
                playerConfig.drm = {
                    clearkey: {
                        keyId: kids[0],
                        key: clearKeys[kids[0]]
                    }
                };

                if (kids.length > 1) {
                    console.warn(
                        'Multiple keys were parsed, but this original JW Player ' +
                        'configuration applies only the first key pair.'
                    );
                }
            }

            try {
                playerElement.style.display = 'block';
                errorElement.style.display = 'none';

                const player = jwplayer('myElement').setup(playerConfig);

                player.on('ready', function () {
                    console.log('JW Player initialized.');
                });

                player.on('error', function (event) {
                    console.error('JW Player error:', event);
                    showError(
                        'Player playback failed. Check the browser console for the exact error and verify that the MPD is accessible.'
                    );
                });
            } catch (error) {
                console.error('Player initialization error:', error);
                showError('Player initialization failed: ' + error.message);
            }
        });
    </script>
</body>

</html>

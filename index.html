<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DRM DASH Player</title>

  <!-- DASH.JS -->
  <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>

  <!-- DASH UI -->
  <script src="https://cdn.dashjs.org/latest/modern/ControlBar.js"></script>

  <link rel="stylesheet"
        href="https://cdn.dashjs.org/latest/modern/controls.css"/>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#000;
      overflow:hidden;
      font-family:Arial,sans-serif;
    }

    #videoContainer{
      width:100%;
      height:100vh;
      position:relative;
      background:#000;
    }

    video{
      width:100%;
      height:100%;
      background:#000;
    }

    #loading{
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%);
      color:white;
      z-index:9999;
      font-size:20px;
    }

    #error{
      position:absolute;
      bottom:20px;
      left:20px;
      color:red;
      z-index:9999;
      font-size:16px;
      max-width:90%;
    }

  </style>

</head>

<body>

<div id="videoContainer">

  <div id="loading">
    Loading Stream...
  </div>

  <div id="error"></div>

  <video
    id="videoPlayer"
    controls
    autoplay
    playsinline
  ></video>

</div>

<script>

(async () => {

  // ==========================
  // GET ID
  // ==========================

  const params =
    new URLSearchParams(window.location.search);

  const streamId =
    params.get("id");

  if (!streamId) {
    showError("No stream ID provided");
    return;
  }

  // ==========================
  // API URL
  // ==========================

  const apiUrl =
    `https://footsters.playsportsapi.workers.dev/?id=${streamId}`;

  try {

    // ==========================
    // FETCH JSON
    // ==========================

    const response =
      await fetch(apiUrl);

    const data =
      await response.json();

    console.log(data);

    // ==========================
    // YOUR JSON FORMAT
    // ==========================

    const stream =
      data[streamId];

    if (!stream) {
      throw new Error("Stream not found");
    }

    if (!stream.url) {
      throw new Error("MPD URL missing");
    }

    if (!stream.keys) {
      throw new Error("DRM Keys missing");
    }

    // ==========================
    // VIDEO
    // ==========================

    const video =
      document.getElementById("videoPlayer");

    if (stream.poster) {
      video.poster = stream.poster;
    }

    // ==========================
    // DASH PLAYER
    // ==========================

    const player =
      dashjs.MediaPlayer().create();

    // DRM
    player.setProtectionData({
      "org.w3.clearkey": {
        clearkeys: stream.keys
      }
    });

    // SETTINGS
    player.updateSettings({
      streaming: {
        lowLatencyEnabled: true,
        fastSwitchEnabled: true
      }
    });

    // INIT
    player.initialize(
      video,
      stream.url,
      true
    );

    // ==========================
    // DASH UI
    // ==========================

    const controlbar =
      new ControlBar(player);

    controlbar.initialize();

    // ==========================
    // EVENTS
    // ==========================

    player.on(
      dashjs.MediaPlayer.events.STREAM_INITIALIZED,
      () => {

        document.getElementById("loading")
          .style.display = "none";

        console.log("Playback started");
      }
    );

    player.on(
      dashjs.MediaPlayer.events.ERROR,
      (e) => {

        console.error(e);

        showError("Playback Error");

        document.getElementById("loading")
          .style.display = "none";
      }
    );

  } catch (err) {

    console.error(err);

    showError(err.message);

    document.getElementById("loading")
      .style.display = "none";
  }

  // ==========================
  // ERROR FUNCTION
  // ==========================

  function showError(msg) {

    document.getElementById("error")
      .innerText = msg;
  }

})();

</script>

</body>
</html>

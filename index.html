<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DRM DASH Player</title>

  <!-- DASH.JS -->
  <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#000;
      overflow:hidden;
      font-family:Arial,sans-serif;
    }

    #player-container{
      width:100%;
      height:100vh;
      position:relative;
      background:#000;
    }

    video{
      width:100%;
      height:100%;
      background:#000;
    }

    #loading{
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%);
      color:#fff;
      font-size:20px;
      z-index:999;
    }

    #error{
      position:absolute;
      bottom:20px;
      left:20px;
      color:red;
      z-index:999;
      font-size:16px;
    }
  </style>
</head>

<body>

<div id="player-container">

  <div id="loading">Loading Stream...</div>

  <div id="error"></div>

  <video
    id="videoPlayer"
    controls
    autoplay
    playsinline
  ></video>

</div>

<script>

(async () => {

  // =========================
  // GET STREAM ID
  // Example:
  // player.html?id=3121
  // =========================

  const params = new URLSearchParams(window.location.search);

  const streamId = params.get("id");

  if (!streamId) {
    document.getElementById("error").innerText =
      "No stream ID provided in URL";
    return;
  }

  // =========================
  // API URL
  // =========================

  const apiUrl =
    `https://footsters.playsportsapi.workers.dev/?id=${streamId}`;

  try {

    // =========================
    // FETCH STREAM DATA
    // =========================

    const response = await fetch(apiUrl);

    if (!response.ok) {
      throw new Error("API request failed");
    }

    const stream = await response.json();

    console.log("Stream Data:", stream);

    // =========================
    // VALIDATION
    // =========================

    if (!stream.url) {
      throw new Error("MPD URL missing");
    }

    if (!stream.keys || Object.keys(stream.keys).length === 0) {
      throw new Error("DRM keys missing");
    }

    // =========================
    // VIDEO ELEMENT
    // =========================

    const video = document.getElementById("videoPlayer");

    // Poster
    if (stream.poster && stream.poster !== "") {
      video.poster = stream.poster;
    }

    // =========================
    // DASH PLAYER
    // =========================

    const player = dashjs.MediaPlayer().create();

    // DRM Protection
    player.setProtectionData({
      "org.w3.clearkey": {
        clearkeys: stream.keys
      }
    });

    // Optional settings
    player.updateSettings({
      streaming: {
        fastSwitchEnabled: true,
        lowLatencyEnabled: true
      }
    });

    // Initialize
    player.initialize(video, stream.url, true);

    // =========================
    // EVENTS
    // =========================

    player.on(
      dashjs.MediaPlayer.events.STREAM_INITIALIZED,
      function () {

        console.log("Stream initialized");

        document.getElementById("loading").style.display = "none";
      }
    );

    player.on(
      dashjs.MediaPlayer.events.ERROR,
      function (e) {

        console.error("DASH ERROR:", e);

        document.getElementById("error").innerText =
          "Playback Error";

        document.getElementById("loading").style.display = "none";
      }
    );

  } catch (err) {

    console.error(err);

    document.getElementById("loading").style.display = "none";

    document.getElementById("error").innerText =
      err.message || "Failed to load stream";
  }

})();

</script>

</body>
</html>
